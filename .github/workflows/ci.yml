name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v

  templates:
    # Installs only the packages listed in assets/requirements.txt, so a missing entry fails here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pkgs
        shell: bash
        run: echo "list=$(python skills/latex-ops/scripts/check_env.py --list-packages)" >> "$GITHUB_OUTPUT"
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: scheme-infraonly ${{ steps.pkgs.outputs.list }}
      - name: Install PDF renderer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python skills/latex-ops/scripts/check_env.py
      - name: Real bibliography, index and trust regressions
        env:
          LATEX_OPS_INTEGRATION: "1"
        run: python -m unittest discover -s tests -p test_build_integration.py -v
      - run: python tests/build_templates.py --gallery gallery
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: gallery
          path: gallery
